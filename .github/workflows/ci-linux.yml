name: Codium::Blocks Linux CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codium-blocks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install Linux dependencies
        run: |
          for source in /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome*; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y build-essential cmake pkg-config libwxgtk3.2-dev libssl-dev \
            imagemagick xvfb

      - name: Configure Linux
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCODIUM_BLOCKS_ENABLE_CODEBLOCKS_ADAPTER=OFF -DCODIUM_BLOCKS_ENABLE_REAL_TOOLCHAIN_TESTS=OFF

      - name: Build Linux
        run: cmake --build build --parallel 1 --verbose

      - name: Run Linux JavaScript checks
        run: |
          node --check extension-host/src/host.mjs
          node --check extensions/hello-codium/extension.cjs
          node --check tests/fake-lsp.mjs
          node --check tests/fake-terminal.mjs
          node --check tests/fake-dap.mjs
          node --check tests/fake-codeblocks-adapter.mjs
          node --check tests/host-smoke.mjs
          node --check tests/integration-matrix-smoke.mjs
          node --check tests/real-lsp-smoke.mjs
          node --check tests/real-dap-smoke.mjs

      - name: Validate Linux integration matrices
        run: node tests/integration-matrix-smoke.mjs

      - name: Run Linux CTest
        run: ctest --test-dir build --output-on-failure

      - name: Run Linux strict sanitizer invariants
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S . -B build-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DCODIUM_BLOCKS_ENABLE_CODEBLOCKS_ADAPTER=OFF \
            -DCODIUM_BLOCKS_STRICT_WARNINGS=ON \
            -DCODIUM_BLOCKS_ENABLE_SANITIZERS=ON
          cmake --build build-sanitized --parallel 1
          ctest --test-dir build-sanitized \
            -R '^(invariants-smoke|security-smoke|problem-model-smoke|terminal-screen-smoke)$' \
            --output-on-failure

      - name: Capture Linux high-contrast workbench
        run: |
          mkdir -p artifacts
          xvfb-run -a --server-args="-screen 0 1600x1000x24" sh -c '
            CODIUM_BLOCKS_THEME=high-contrast ./build/codium-blocks >artifacts/native-ui-linux.log 2>&1 &
            pid=$!
            sleep 4
            import -window root artifacts/codium-blocks-linux-high-contrast.png
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          '
          test -s artifacts/codium-blocks-linux-high-contrast.png

      - name: Upload Linux visual validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: codium-blocks-linux-visual-validation
          path: artifacts/
