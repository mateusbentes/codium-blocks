name: Codium::Blocks macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS (macos-15)
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23.6'
          cache: false

      - name: Install macOS dependencies
        run: |
          brew update
          brew install cmake wxwidgets llvm@18 rustup
          echo "$(brew --prefix wxwidgets)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix rustup)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix wxwidgets)/lib/pkgconfig" >> "$GITHUB_ENV"
          export PATH="$(brew --prefix rustup)/bin:$PATH"
          rustup --version
          rustup toolchain install 1.82.0 --profile minimal
          rustup component add rust-analyzer --toolchain 1.82.0
          mkdir -p "$HOME/.local/bin"
          rustAnalyzer=$(find "$HOME/.rustup/toolchains" -path '*/bin/rust-analyzer' | head -1)
          ln -sf "$rustAnalyzer" "$HOME/.local/bin/rust-analyzer"
          GOTOOLCHAIN=go1.23.6 GOBIN="$HOME/.local/bin" go install golang.org/x/tools/gopls@v0.17.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install --global pyright@1.1.390

      - name: Configure macOS
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Verify macOS toolchain versions
        run: |
          clangd --version | grep -F '18.1.8'
          rust-analyzer --version | grep -F '1.82.0'
          gopls version | grep -F 'v0.17.1'
          pyright --version | grep -F '1.1.390'
          llvm-config --version | grep -F '18.1.8'

      - name: Build macOS
        run: cmake --build build --parallel 1 --verbose

      - name: Run macOS JavaScript checks
        run: |
          node --check extension-host/src/host.mjs
          node --check extensions/hello-codium/extension.cjs
          node --check tests/fake-lsp.mjs
          node --check tests/fake-terminal.mjs
          node --check tests/fake-dap.mjs
          node --check tests/fake-codeblocks-adapter.mjs
          node --check tests/host-smoke.mjs
          node --check tests/integration-matrix-smoke.mjs
          node --check tests/real-lsp-smoke.mjs
          node --check tests/real-dap-smoke.mjs

      - name: Validate macOS integration matrices
        run: node tests/integration-matrix-smoke.mjs

      - name: Run macOS CTest
        run: ctest --test-dir build --output-on-failure

      - name: Run macOS Extension Host smoke test
        run: node tests/host-smoke.mjs

      - name: Capture macOS high-contrast workbench
        run: |
          mkdir -p artifacts
          CODIUM_BLOCKS_THEME=high-contrast ./build/codium-blocks >artifacts/native-ui-macos.log 2>&1 &
          pid=$!
          sleep 4
          screencapture -x artifacts/codium-blocks-macos-high-contrast.png
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          test -s artifacts/codium-blocks-macos-high-contrast.png

      - name: Upload macOS visual validation
        uses: actions/upload-artifact@v7
        with:
          name: codium-blocks-macos-visual-validation
          path: artifacts/

  bundle-macos:
    name: macOS bundle (macos-15)
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install macOS bundle dependencies
        run: |
          brew update
          brew install cmake wxwidgets
          echo "$(brew --prefix wxwidgets)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix wxwidgets)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Configure macOS bundle
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCODIUM_BLOCKS_ENABLE_CODEBLOCKS_ADAPTER=OFF -DCODIUM_BLOCKS_MACOS_BUNDLE=ON

      - name: Build macOS bundle
        run: cmake --build build --config Release --parallel 2

      - name: Run macOS bundle validation
        run: |
          ctest --test-dir build -C Release -R 'localization-smoke|install-layout-smoke|terminal-screen-smoke|terminal-profile-smoke' --output-on-failure
          node --check extension-host/src/host.mjs
          node tests/host-smoke.mjs

      - name: Capture macOS bundle high-contrast workbench
        run: |
          mkdir -p artifacts
          CODIUM_BLOCKS_THEME=high-contrast ./build/codium-blocks.app/Contents/MacOS/codium-blocks >artifacts/native-ui-macos-bundle.log 2>&1 &
          pid=$!
          sleep 4
          screencapture -x artifacts/codium-blocks-macos-bundle-high-contrast.png
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          test -s artifacts/codium-blocks-macos-bundle-high-contrast.png

      - name: Upload macOS bundle visual validation
        uses: actions/upload-artifact@v7
        with:
          name: codium-blocks-macos-bundle-visual-validation
          path: artifacts/
