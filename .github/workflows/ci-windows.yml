name: Codium::Blocks Windows CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codium-blocks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install Windows dependencies
        shell: pwsh
        run: |
          vcpkg install wxwidgets:x64-windows

      - name: Configure Windows
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCODIUM_BLOCKS_ENABLE_CODEBLOCKS_ADAPTER=OFF -DCODIUM_BLOCKS_ENABLE_REAL_TOOLCHAIN_TESTS=OFF

      - name: Build Windows
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run Windows JavaScript checks
        shell: pwsh
        run: |
          node --check extension-host/src/host.mjs
          node --check extensions/hello-codium/extension.cjs
          node --check tests/fake-lsp.mjs
          node --check tests/fake-terminal.mjs
          node --check tests/fake-dap.mjs
          node --check tests/fake-codeblocks-adapter.mjs
          node --check tests/host-smoke.mjs
          node --check tests/integration-matrix-smoke.mjs
          node --check tests/real-lsp-smoke.mjs
          node --check tests/real-dap-smoke.mjs

      - name: Validate Windows integration matrices
        shell: pwsh
        run: node tests/integration-matrix-smoke.mjs

      - name: Run Windows CTest
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run Windows ConPTY smoke
        shell: pwsh
        run: |
          $env:CODIUM_BLOCKS_REQUIRE_CONPTY = '1'
          ctest --test-dir build -C Release -R '^transport-smoke$' --output-on-failure
          Remove-Item Env:CODIUM_BLOCKS_REQUIRE_CONPTY

      - name: Run Windows Extension Host smoke test
        shell: pwsh
        run: node tests/host-smoke.mjs

      - name: Capture Windows high-contrast workbench
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $process = Start-Process -FilePath "$PWD/build/Release/codium-blocks.exe" -PassThru -Environment @{ CODIUM_BLOCKS_THEME = 'high-contrast' }
          Start-Sleep -Seconds 4
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Left, $bounds.Top, 0, 0, $bitmap.Size)
          $bitmap.Save("$PWD/artifacts/codium-blocks-windows-high-contrast.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $bitmap.Dispose()
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path "$PWD/artifacts/codium-blocks-windows-high-contrast.png")) { throw 'Windows visual validation did not create a screenshot.' }

      - name: Upload Windows visual validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: codium-blocks-windows-visual-validation
          path: artifacts/
