name: Codium::Blocks CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux dependencies
        run: |
          for source in /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome*; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y build-essential cmake pkg-config libwxgtk3.2-dev libssl-dev

      - name: Configure Linux
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Linux
        run: cmake --build build --parallel 1 --verbose

      - name: Run Linux JavaScript checks
        run: |
          node --check extension-host/src/host.mjs
          node --check extensions/hello-codium/extension.cjs
          node --check tests/fake-lsp.mjs
          node --check tests/fake-terminal.mjs
          node --check tests/fake-dap.mjs
          node --check tests/fake-codeblocks-adapter.mjs
          node --check tests/host-smoke.mjs
          node --check tests/real-lsp-smoke.mjs

      - name: Run Linux CTest
        run: ctest --test-dir build --output-on-failure

      - name: Run Linux Extension Host smoke test
        run: node tests/host-smoke.mjs

  build-macos:
    name: macOS (macos-15)
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install macOS dependencies
        run: |
          brew update
          brew install cmake wxwidgets
          echo "$(brew --prefix wxwidgets)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix wxwidgets)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Configure macOS
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build macOS
        run: cmake --build build --parallel 1 --verbose

      - name: Run macOS JavaScript checks
        run: |
          node --check extension-host/src/host.mjs
          node --check extensions/hello-codium/extension.cjs
          node --check tests/fake-lsp.mjs
          node --check tests/fake-terminal.mjs
          node --check tests/fake-dap.mjs
          node --check tests/fake-codeblocks-adapter.mjs
          node --check tests/host-smoke.mjs
          node --check tests/real-lsp-smoke.mjs

      - name: Run macOS CTest
        run: ctest --test-dir build --output-on-failure

      - name: Run macOS Extension Host smoke test
        run: node tests/host-smoke.mjs

  build-windows:
    name: Windows (windows-2022)
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Windows dependencies
        shell: pwsh
        run: vcpkg install wxwidgets:x64-windows

      - name: Configure Windows
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build Windows
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run Windows JavaScript checks
        shell: pwsh
        run: |
          node --check extension-host/src/host.mjs
          node --check extensions/hello-codium/extension.cjs
          node --check tests/fake-lsp.mjs
          node --check tests/fake-terminal.mjs
          node --check tests/fake-dap.mjs
          node --check tests/fake-codeblocks-adapter.mjs
          node --check tests/host-smoke.mjs
          node --check tests/real-lsp-smoke.mjs

      - name: Run Windows CTest
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run Windows Extension Host smoke test
        shell: pwsh
        run: node tests/host-smoke.mjs

  codeblocks-sdk-integration:
    name: Code::Blocks SDK integration (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Code::Blocks SDK and virtual display
        run: |
          for source in /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome*; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y build-essential cmake pkg-config libwxgtk3.2-dev \
            codeblocks codeblocks-dev libtinyxml-dev xvfb

      - name: Configure with the installed SDK
        run: cmake -S . -B build-sdk -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build the SDK adapter
        run: cmake --build build-sdk --parallel 2

      - name: Run the real SDK smokes
        run: >-
          ctest --test-dir build-sdk
          -R "codeblocks-(real-adapter|sdk-events)-smoke"
          --output-on-failure

  codeblocks-debuggergdb-provider:
    name: Code::Blocks DebuggerGDB provider (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install matched SDK, provider source, and virtual display
        run: |
          for source in /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome*; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y build-essential cmake pkg-config libwxgtk3.2-dev \
            codeblocks codeblocks-dev libtinyxml-dev subversion xvfb
          mkdir -p provider-source/src/plugins
          svn export -q -r 13046 \
            http://svn.code.sf.net/p/codeblocks/code/trunk/src/plugins/debuggergdb \
            provider-source/src/plugins/debuggergdb

      - name: Configure the matched DebuggerGDB provider
        run: >-
          cmake -S . -B build-e2 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          -DCODIUM_BLOCKS_ENABLE_CODEBLOCKS_DEBUGGERGDB_PROVIDER=ON
          -DCODIUM_BLOCKS_CODEBLOCKS_DEBUGGERGDB_SOURCE_DIR=$GITHUB_WORKSPACE/provider-source/src/plugins/debuggergdb
          -DCODIUM_BLOCKS_CODEBLOCKS_DEBUGGERGDB_SOURCE_REVISION=r13046
          -DCODIUM_BLOCKS_CODEBLOCKS_DEBUGGERGDB_ABI_TAG=ubuntu-24.04-codeblocks-svn13046-gcc-wx3.2-x86_64-cxx17

      - name: Build the matched provider and adapter
        run: cmake --build build-e2 --parallel 2

      - name: Run the E.2 real debugger smoke tests
        run: >-
          ctest --test-dir build-e2
          -R "codeblocks-(real-adapter|sdk-events)-smoke"
          --output-on-failure
