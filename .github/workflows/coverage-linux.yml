name: Codium::Blocks Linux coverage

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '19 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codium-blocks-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-linux:
    name: Linux GCC coverage (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install coverage dependencies
        run: |
          for source in /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome*; do
            if [ -f "$source" ]; then sudo mv "$source" "$source.disabled"; fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libwxgtk3.2-dev libssl-dev python3-venv
      - name: Install pinned coverage tool
        run: |
          python3 -m venv .quality-venv
          .quality-venv/bin/python -m pip install --disable-pip-version-check --retries 5 --timeout 60 \
            --only-binary=:all: --requirement tools/coverage/requirements.txt
      - name: Configure and build coverage tree
        run: |
          cmake --preset coverage-gcc
          cmake --build --preset coverage-gcc --parallel 2
      - name: Run full coverage test suite
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build/coverage --output-on-failure
      - name: Generate coverage reports
        run: |
          mkdir -p artifacts/coverage
          .quality-venv/bin/gcovr --root . --object-directory build/coverage \
            --filter 'native/' --exclude 'tests/' --exclude 'build/' --txt-metric branch \
            --xml-pretty -o artifacts/coverage/codium-blocks-coverage.xml \
            --html-details artifacts/coverage/codium-blocks-coverage.html \
            --txt artifacts/coverage/codium-blocks-coverage.txt \
            --print-summary
          test -s artifacts/coverage/codium-blocks-coverage.xml
          test -s artifacts/coverage/codium-blocks-coverage.html
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: codium-blocks-linux-coverage
          path: artifacts/coverage/
