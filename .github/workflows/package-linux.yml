name: Codium::Blocks Linux Packages

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codium-blocks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-linux:
    name: Linux packages (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install Linux packaging dependencies
        run: |
          for source in /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome*; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y build-essential cmake pkg-config libwxgtk3.2-dev libssl-dev imagemagick xvfb

      - name: Configure Linux package build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCODIUM_BLOCKS_ENABLE_CODEBLOCKS_ADAPTER=OFF -DCODIUM_BLOCKS_ENABLE_REAL_TOOLCHAIN_TESTS=OFF

      - name: Build Linux package
        run: cmake --build build --parallel 2

      - name: Run Linux package validation
        run: |
          ctest --test-dir build --output-on-failure
          node --check extension-host/src/host.mjs

      - name: Generate Linux packages
        run: |
          set -euo pipefail
          cmake --build build --target install/strip -- DESTDIR="$PWD/staging"
          staged_root="$(find staging -type f -path '*/bin/codium-blocks' -printf '%h/..\n' -quit)"
          test -n "$staged_root"
          staged_root="$(realpath "$staged_root")"
          test -x "$staged_root/bin/codium-blocks"
          test -f "$staged_root/share/codium-blocks/locales/en-US.tsv"
          test -f "$staged_root/share/codium-blocks/locales/pt-BR.tsv"
          test -f "$staged_root/share/doc/codium-blocks/CHANGELOG.md"
          run_startup_smoke() {
            local root="$1"
            local label="$2"
            local data_root="$RUNNER_TEMP/codium-blocks-${label}-data"
            local log="build/codium-blocks-${label}.log"
            rm -rf "$data_root"
            mkdir -p "$data_root"
            CODIUM_BLOCKS_DATA="$data_root" xvfb-run -a "$root/bin/codium-blocks" >"$log" 2>&1 &
            local pid=$!
            sleep 4
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            else
              wait "$pid" || true
              cat "$log" >&2 || true
              echo "${label} package executable exited before the startup window completed." >&2
              return 1
            fi
          }
          run_startup_smoke "$staged_root" linux-staged
          (cd build && cpack)
          debs=(build/codium-blocks-*.deb)
          tgzs=(build/codium-blocks-*.tar.gz)
          test "${#debs[@]}" -eq 1
          test "${#tgzs[@]}" -eq 1
          deb="${debs[0]}"
          tgz="${tgzs[0]}"
          test -s "$deb"
          test -s "$tgz"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -F 'usr/bin/codium-blocks'
          dpkg-deb --contents "$deb" | grep -F 'en-US.tsv'
          dpkg-deb --contents "$deb" | grep -F 'pt-BR.tsv'
          dpkg-deb --contents "$deb" | grep -F 'CHANGELOG.md'
          tar -tzf "$tgz" | grep -F 'bin/codium-blocks'
          tar -tzf "$tgz" | grep -F 'locales/en-US.tsv'
          tar -tzf "$tgz" | grep -F 'locales/pt-BR.tsv'
          tar -tzf "$tgz" | grep -F 'CHANGELOG.md'
          tgz_root="$RUNNER_TEMP/codium-blocks-linux-tgz"
          rm -rf "$tgz_root"
          mkdir -p "$tgz_root"
          tar -xzf "$tgz" -C "$tgz_root" --strip-components=1
          test -x "$tgz_root/bin/codium-blocks"
          run_startup_smoke "$tgz_root" linux-tgz
          deb_root="$RUNNER_TEMP/codium-blocks-linux-deb"
          rm -rf "$deb_root"
          mkdir -p "$deb_root"
          dpkg-deb --extract "$deb" "$deb_root"
          test -x "$deb_root/usr/bin/codium-blocks"
          run_startup_smoke "$deb_root/usr" linux-deb
          version=$(sed -n 's/.*project(CodiumBlocks VERSION \([^ )]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          SOURCE_DATE_EPOCH=0 python3 scripts/generate-sbom.py --root staging --version "$version" --output build/codium-blocks-linux-staging.spdx.json
          python3 -m json.tool build/codium-blocks-linux-staging.spdx.json >/dev/null
          (cd build && sha256sum "$(basename "$deb")" "$(basename "$tgz")") > build/codium-blocks-linux.sha256

      - name: Upload Linux package diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: ignore
          name: codium-blocks-linux-package-diagnostics
          path: build/codium-blocks-linux-*.log

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: codium-blocks-linux-packages
          path: |
            build/codium-blocks-*.deb
            build/codium-blocks-*.tar.gz
            build/codium-blocks-*.sha256
            build/codium-blocks-linux.sha256
            build/codium-blocks-linux-staging.spdx.json
