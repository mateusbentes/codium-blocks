name: Codium::Blocks Windows Package

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '29 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codium-blocks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows:
    name: Windows portable package (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Set up Python for packaging tools
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10.11'

      - name: Install Windows packaging dependencies
        shell: pwsh
        run: |
          vcpkg install wxwidgets:x64-windows
          $runtimeDir = Join-Path $env:RUNNER_TEMP 'codium-blocks-windows-runtime'
          Remove-Item -Recurse -Force $runtimeDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $vcpkgBin = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/bin'
          Copy-Item (Join-Path $vcpkgBin '*.dll') $runtimeDir -Force
          $crt = Get-ChildItem -Path (Join-Path $env:ProgramFiles 'Microsoft Visual Studio/2022') -Recurse -Filter 'vcruntime140.dll' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Microsoft\.VC143\.CRT' } |
            Select-Object -First 1
          if (-not $crt) { throw 'Could not locate the x64 Microsoft Visual C++ runtime directory.' }
          Copy-Item (Join-Path $crt.DirectoryName '*.dll') $runtimeDir -Force
          "CODIUM_BLOCKS_WINDOWS_RUNTIME_DIR=$runtimeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Windows portable package
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DBUILD_TESTING=ON
          -DCODIUM_BLOCKS_ENABLE_CODEBLOCKS_ADAPTER=OFF
          -DCODIUM_BLOCKS_ENABLE_REAL_TOOLCHAIN_TESTS=OFF
          -DCODIUM_BLOCKS_WINDOWS_RUNTIME_DIR="$env:CODIUM_BLOCKS_WINDOWS_RUNTIME_DIR"

      - name: Build Windows portable package
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Run Windows package validation
        shell: pwsh
        run: |
          ctest --test-dir build -C Release -LE "conpty|fuzz" --output-on-failure
          node --check extension-host/src/host.mjs
          node tests/host-smoke.mjs

      - name: Generate Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $diagnostic = Join-Path $env:RUNNER_TEMP 'codium-blocks-windows-package.log'
          Remove-Item -LiteralPath $diagnostic -Force -ErrorAction SilentlyContinue
          function Log([string] $message) {
            $message | Tee-Object -FilePath $diagnostic -Append
          }
          function Invoke-LoggedNative([string] $label, [string] $program, [string[]] $arguments) {
            Log $label
            $nativeOutput = & $program @arguments 2>&1
            $nativeExitCode = $LASTEXITCODE
            foreach ($line in @($nativeOutput)) { Log ([string]$line) }
            if ($nativeExitCode -ne 0) { throw "$label failed with exit code $nativeExitCode." }
          }
          try {
          $cmakeText = Get-Content -LiteralPath CMakeLists.txt -Raw
          $version = [regex]::Match($cmakeText, 'project\(CodiumBlocks VERSION ([^ )]+)').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Could not determine the project version from CMakeLists.txt.' }
          $staging = Join-Path $env:RUNNER_TEMP 'codium-blocks-windows-package-staging'
          Remove-Item -Recurse -Force $staging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Log "Installing package into $staging"
          Invoke-LoggedNative 'Installing staged package' 'cmake' @('--install', 'build', '--config', 'Release', '--prefix', $staging)
          $binDir = Join-Path $staging 'bin'
          if (-not (Test-Path -LiteralPath $binDir -PathType Container)) { throw "Windows install did not create its bin directory: $binDir" }
          if (Test-Path -LiteralPath $env:CODIUM_BLOCKS_WINDOWS_RUNTIME_DIR -PathType Container) {
            Copy-Item (Join-Path $env:CODIUM_BLOCKS_WINDOWS_RUNTIME_DIR '*.dll') $binDir -Force
            Log "Copied the prepared Windows runtime DLLs into $binDir"
          }
          $runtimeFiles = @(Get-ChildItem -LiteralPath $binDir -Filter '*.dll' -File -ErrorAction SilentlyContinue)
          if ($runtimeFiles.Count -eq 0) { throw 'Windows runtime staging directory contains no DLLs.' }
          $stagingEntries = @(Get-ChildItem -LiteralPath $staging -Force)
          if ($stagingEntries.Count -eq 0) { throw 'Windows install staging is empty.' }
          Log ("Staged files: " + ((Get-ChildItem -LiteralPath $staging -Recurse -File | ForEach-Object { $_.FullName.Substring($staging.Length + 1) }) -join ', '))
          $buildDir = (Resolve-Path -LiteralPath build).Path
          $package = Join-Path $buildDir "codium-blocks-$version-Windows-portable.zip"
          Invoke-LoggedNative "Creating ZIP $package" 'python' @('scripts/create-portable-zip.py', '--root', $staging, '--output', $package)
          if (-not (Test-Path $package)) { throw "Windows package was not created: $package" }
          Log ("ZIP size: " + (Get-Item -LiteralPath $package).Length + ' bytes')
          Log ("ZIP SHA-256: " + (Get-FileHash -Algorithm SHA256 -LiteralPath $package).Hash.ToLowerInvariant())
          Log 'Testing ZIP integrity with Python zipfile before native extraction'
          Invoke-LoggedNative 'Testing ZIP integrity with Python zipfile' 'python' @('-m', 'zipfile', '-t', $package)
          Invoke-LoggedNative 'Listing ZIP entries with Python zipfile' 'python' @('-m', 'zipfile', '-l', $package)
          $expanded = Join-Path $env:RUNNER_TEMP 'codium-blocks-package-validation'
          Remove-Item -Recurse -Force $expanded -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $expanded | Out-Null
          Log "Expanding ZIP into $expanded"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($package, $expanded)
          Log 'Native .NET ZIP extraction completed.'
          if (-not (Get-ChildItem -Path $expanded -Recurse -Filter 'codium-blocks.exe')) { throw 'Windows package is missing the native executable.' }
          if (-not (Get-ChildItem -Path $expanded -Recurse -Filter 'en-US.tsv')) { throw 'Windows package is missing en-US.tsv.' }
          if (-not (Get-ChildItem -Path $expanded -Recurse -Filter 'pt-BR.tsv')) { throw 'Windows package is missing pt-BR.tsv.' }
          if (-not (Get-ChildItem -Path $expanded -Recurse -Filter 'CHANGELOG.md')) { throw 'Windows package is missing CHANGELOG.md.' }
          if (-not (Get-ChildItem -Path $expanded -Recurse -Filter 'wx*.dll')) { throw 'Windows package is missing wxWidgets runtime DLLs.' }
          if (-not (Get-ChildItem -Path $expanded -Recurse -Filter 'vcruntime140*.dll')) { throw 'Windows package is missing the Microsoft Visual C++ runtime.' }
          if (-not (Get-ChildItem -Path $expanded -Recurse -Filter 'msvcp140*.dll')) { throw 'Windows package is missing the Microsoft C++ standard library runtime.' }
          Invoke-LoggedNative 'Generating Windows package SBOM' 'python' @('scripts/generate-sbom.py', '--root', $expanded, '--version', $version, '--output', 'build/codium-blocks-windows-package.spdx.json')
          Invoke-LoggedNative 'Validating Windows package SBOM JSON' 'python' @('-m', 'json.tool', 'build/codium-blocks-windows-package.spdx.json')
          $dataRoot = Join-Path $env:RUNNER_TEMP 'codium-blocks-package-data'
          Remove-Item -Recurse -Force $dataRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          $executable = (Get-ChildItem -Path $expanded -Recurse -Filter 'codium-blocks.exe' | Select-Object -First 1).FullName
          $stdout = Join-Path $env:RUNNER_TEMP 'codium-blocks-package.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'codium-blocks-package.stderr.log'
          $previousDataRoot = $env:CODIUM_BLOCKS_DATA
          $env:CODIUM_BLOCKS_DATA = $dataRoot
          $process = Start-Process -FilePath $executable -WorkingDirectory (Split-Path $executable) -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 4
          $process.Refresh()
          if ($process.HasExited) {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "Packaged executable exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          if ($null -eq $previousDataRoot) { Remove-Item Env:CODIUM_BLOCKS_DATA -ErrorAction SilentlyContinue }
          else { $env:CODIUM_BLOCKS_DATA = $previousDataRoot }
          $hashes = Get-FileHash -Algorithm SHA256 $package
          $hashes | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content build/codium-blocks-windows.sha256
          Log 'Windows package validation completed.'
          } catch {
            Log (($_ | Out-String).TrimEnd())
            throw
          }

      - name: Upload Windows package diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: ignore
          name: codium-blocks-windows-package-diagnostics
          path: |
            ${{ runner.temp }}/codium-blocks-package.stdout.log
            ${{ runner.temp }}/codium-blocks-package.stderr.log
            ${{ runner.temp }}/codium-blocks-windows-package.log

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: codium-blocks-windows-package
          path: |
            build/codium-blocks-*.zip
            build/codium-blocks-windows.sha256
            build/codium-blocks-windows-package.spdx.json
