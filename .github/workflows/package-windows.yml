name: Codium::Blocks Windows Package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: codium-blocks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows:
    name: Windows portable package (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^project\(CodiumBlocks VERSION ([^ ]+)' | Select-Object -First 1).Matches.Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version) -or $env:GITHUB_REF_NAME -ne "v$version") { throw "Release tag does not match CMake project version $version." }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install Windows packaging dependencies
        shell: pwsh
        run: |
          vcpkg install wxwidgets:x64-windows
          $runtimeDir = Join-Path $env:RUNNER_TEMP 'codium-blocks-windows-runtime'
          Remove-Item -Recurse -Force $runtimeDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $vcpkgBin = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed/x64-windows/bin'
          Copy-Item (Join-Path $vcpkgBin '*.dll') $runtimeDir -Force
          $crt = Get-ChildItem -Path (Join-Path $env:ProgramFiles 'Microsoft Visual Studio/2022') -Recurse -Filter 'vcruntime140.dll' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Microsoft\.VC143\.CRT' } |
            Select-Object -First 1
          if (-not $crt) { throw 'Could not locate the x64 Microsoft Visual C++ runtime directory.' }
          Copy-Item (Join-Path $crt.DirectoryName '*.dll') $runtimeDir -Force
          "CODIUM_BLOCKS_WINDOWS_RUNTIME_DIR=$runtimeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Windows portable package
        shell: pwsh
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DBUILD_TESTING=ON
          -DCODIUM_BLOCKS_ENABLE_CODEBLOCKS_ADAPTER=OFF
          -DCODIUM_BLOCKS_WINDOWS_RUNTIME_DIR="$env:CODIUM_BLOCKS_WINDOWS_RUNTIME_DIR"

      - name: Build Windows portable package
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Run Windows package validation
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          node --check extension-host/src/host.mjs
          node tests/host-smoke.mjs

      - name: Generate Windows ZIP
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -C Release
          $packages = @(Get-ChildItem build/codium-blocks-*.zip)
          if ($packages.Count -ne 1) { throw "Expected exactly one Windows package, found $($packages.Count)." }
          $expanded = Join-Path $env:RUNNER_TEMP 'codium-blocks-package-validation'
          Remove-Item -Recurse -Force $expanded -ErrorAction SilentlyContinue
          Expand-Archive -Path $packages[0].FullName -DestinationPath $expanded
          if (-not (Get-ChildItem -Path $expanded -Recurse -Filter 'codium-blocks.exe')) { throw 'Windows package is missing the native executable.' }
          if (-not (Get-ChildItem -Path $expanded -Recurse -Filter 'en-US.tsv')) { throw 'Windows package is missing en-US.tsv.' }
          if (-not (Get-ChildItem -Path $expanded -Recurse -Filter 'pt-BR.tsv')) { throw 'Windows package is missing pt-BR.tsv.' }
          if (-not (Get-ChildItem -Path $expanded -Recurse -Filter 'CHANGELOG.md')) { throw 'Windows package is missing CHANGELOG.md.' }
          if (-not (Get-ChildItem -Path $expanded -Recurse -Filter 'wx*.dll')) { throw 'Windows package is missing wxWidgets runtime DLLs.' }
          if (-not (Get-ChildItem -Path $expanded -Recurse -Filter 'vcruntime140*.dll')) { throw 'Windows package is missing the Microsoft Visual C++ runtime.' }
          if (-not (Get-ChildItem -Path $expanded -Recurse -Filter 'msvcp140*.dll')) { throw 'Windows package is missing the Microsoft C++ standard library runtime.' }
          $dataRoot = Join-Path $env:RUNNER_TEMP 'codium-blocks-package-data'
          Remove-Item -Recurse -Force $dataRoot -ErrorAction SilentlyContinue
          $executable = (Get-ChildItem -Path $expanded -Recurse -Filter 'codium-blocks.exe' | Select-Object -First 1).FullName
          $process = Start-Process -FilePath $executable -PassThru -Environment @{ CODIUM_BLOCKS_DATA = $dataRoot }
          Start-Sleep -Seconds 4
          $process.Refresh()
          if ($process.HasExited) { throw "Packaged executable exited during startup with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          $hashes = $packages | Get-FileHash -Algorithm SHA256
          $hashes | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content build/codium-blocks-windows.sha256

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: error
          name: codium-blocks-windows-package
          path: |
            build/codium-blocks-*.zip
            build/codium-blocks-windows.sha256
