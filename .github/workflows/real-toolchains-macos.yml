name: Codium::Blocks macOS real toolchain matrix

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '53 4 * * 0'

permissions:
  contents: read

concurrency:
  group: codium-blocks-real-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-macos:
    name: macOS real LSP and DAP matrix (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Validate matrix contracts
        run: node tests/integration-matrix-smoke.mjs
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23.6'
          cache: false
      - name: Install pinned macOS toolchains
        run: |
          test "$(uname -m)" = "arm64"
          brew update
          brew install rustup cmake
          llvm_archive="clang+llvm-18.1.8-arm64-apple-macos11.tar.xz"
          llvm_url="https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang%2Bllvm-18.1.8-arm64-apple-macos11.tar.xz"
          llvm_sha256="4573b7f25f46d2a9c8882993f091c52f416c83271db6f5b213c93f0bd0346a10"
          curl --fail --location --retry 3 --retry-delay 2 --output "$RUNNER_TEMP/$llvm_archive" "$llvm_url"
          echo "$llvm_sha256  $RUNNER_TEMP/$llvm_archive" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/llvm-18.1.8"
          tar -xJf "$RUNNER_TEMP/$llvm_archive" -C "$RUNNER_TEMP/llvm-18.1.8" --strip-components=1
          for tool in clangd clang++ lldb-dap llvm-config; do
            test -x "$RUNNER_TEMP/llvm-18.1.8/bin/$tool"
          done
          echo "$RUNNER_TEMP/llvm-18.1.8/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix rustup)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix rustup)/bin:$PATH"
          rustup toolchain install 1.82.0 --profile minimal
          rustup component add rust-analyzer --toolchain 1.82.0
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(find "$HOME/.rustup/toolchains" -path '*/bin/rust-analyzer' | head -1)" "$HOME/.local/bin/rust-analyzer"
          GOTOOLCHAIN=go1.23.6 GOBIN="$HOME/.local/bin" go install golang.org/x/tools/gopls@v0.17.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install --global pyright@1.1.390
      - name: Verify pinned versions
        run: |
          clangd --version | grep -F '18.1.8'
          rust-analyzer --version | grep -F '1.82.0'
          gopls version | grep -F 'v0.17.1'
          pyright --version | grep -F '1.1.390'
          llvm-config --version | grep -F '18.1.8'
          lldb-dap --help | grep -F 'LLDB DAP'
      - name: Run strict real LSP matrix
        env:
          CODIUM_BLOCKS_REQUIRE_REAL_LSP: '1'
        run: node tests/real-lsp-smoke.mjs
      - name: Build real DAP debuggee
        run: |
          apple_clang=$(xcrun --sdk macosx --find clang++)
          macos_sdk=$(xcrun --sdk macosx --show-sdk-path)
          test -x "$apple_clang"
          test -d "$macos_sdk"
          "$apple_clang" -isysroot "$macos_sdk" -mmacosx-version-min=11.0 \
            -std=c++17 -g -O0 tests/fixtures/real-dap-debuggee.cpp \
            -o /tmp/codium-blocks-real-dap-debuggee
      - name: Select signed macOS debugserver
        run: |
          developer_dir=$(xcode-select --print-path)
          debugserver=''
          for candidate in \
            "$developer_dir/../SharedFrameworks/LLDB.framework/Versions/A/Resources/debugserver" \
            "$developer_dir/Library/PrivateFrameworks/LLDB.framework/Versions/A/Resources/debugserver"; do
            if test -x "$candidate"; then
              debugserver="$candidate"
              break
            fi
          done
          if test -z "$debugserver"; then
            echo "Could not locate the signed Xcode or Command Line Tools debugserver from $developer_dir" >&2
            exit 1
          fi
          case "$debugserver" in
            "$RUNNER_TEMP/llvm-18.1.8/"*)
              echo "Refusing to use the LLVM archive debugserver; the macOS system debugserver is required." >&2
              exit 1
              ;;
          esac
          echo "Using signed macOS debugserver: $debugserver"
          codesign --verify --verbose "$debugserver"
          echo "LLDB_DEBUGSERVER_PATH=$debugserver" >> "$GITHUB_ENV"
      - name: Run strict real DAP matrix
        env:
          CODIUM_BLOCKS_REQUIRE_REAL_DAP: '1'
          CODIUM_BLOCKS_REAL_DAP_TRACE: '1'
          CODIUM_BLOCKS_REAL_DAP_DEBUGGEE: /tmp/codium-blocks-real-dap-debuggee
          CODIUM_BLOCKS_REAL_DAP_SOURCE: ${{ github.workspace }}/tests/fixtures/real-dap-debuggee.cpp
          LLDBDAP_LOG: ${{ runner.temp }}/lldb-dap-internal.log
        run: |
          set -o pipefail
          node tests/real-dap-smoke.mjs 2>&1 | tee "$RUNNER_TEMP/codium-blocks-real-dap.log"

      - name: Upload macOS DAP diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          if-no-files-found: ignore
          name: codium-blocks-macos-dap-diagnostics
          path: |
            ${{ runner.temp }}/codium-blocks-real-dap.log
            ${{ runner.temp }}/lldb-dap-internal.log
