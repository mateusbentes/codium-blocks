name: Codium::Blocks Windows real toolchain matrix

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '7 5 * * 0'

permissions:
  contents: read

concurrency:
  group: codium-blocks-real-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-windows:
    name: Windows real LSP and DAP matrix (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Validate matrix contracts
        shell: pwsh
        run: node tests/integration-matrix-smoke.mjs
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23.6'
          cache: false
      - name: Set up Python for LLDB-DAP
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10.11'
      - name: Restore pinned Windows toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/llvm-18.1.8
            ~/.rustup/toolchains/1.82.0-x86_64-pc-windows-msvc
          key: codium-blocks-real-windows-toolchains-llvm-18.1.8-installer-python-3.10.11-rust-1.82.0-v8-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned LLVM and Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $llvmRoot = Join-Path $env:RUNNER_TEMP 'llvm-18.1.8'
          $llvmBin = Join-Path $llvmRoot 'bin'
          $requiredTools = @('clang.exe', 'clang-cl.exe', 'clangd.exe', 'lldb-dap.exe')
          $requiredPaths = @($requiredTools | ForEach-Object { Join-Path $llvmBin $_ })
          $requiredPaths += Join-Path $llvmRoot 'lib/site-packages/lldb'
          [array]$missingPaths = @(
            $requiredPaths | Where-Object { -not (Test-Path -LiteralPath $_) }
          )
          $cacheComplete = ($missingPaths.Count -eq 0)
          if (-not $cacheComplete) {
            Write-Host "Pinned Windows toolchain cache is incomplete; missing: $($missingPaths -join ', ')"
          }
          if (-not $cacheComplete) {
            $llvmInstaller = Join-Path $env:RUNNER_TEMP 'LLVM-18.1.8-win64.exe'
            $llvmUrl = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe'
            $llvmSha256 = '94af030060d88cc17e9f00ef1663ebdc1126b35e16bebdfa1e807984b70abd8f'
            Remove-Item -Recurse -Force $llvmRoot -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $llvmInstaller -Force -ErrorAction SilentlyContinue
            Write-Host "Downloading pinned LLVM installer to $llvmInstaller"
            curl.exe --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 --output $llvmInstaller $llvmUrl
            if ((Get-FileHash -Algorithm SHA256 $llvmInstaller).Hash.ToLowerInvariant() -ne $llvmSha256) {
              throw 'LLVM 18.1.8 Windows installer checksum mismatch.'
            }
            if ((Get-Item -LiteralPath $llvmInstaller).Length -lt 350MB) {
              throw 'LLVM 18.1.8 Windows installer is unexpectedly small.'
            }
            New-Item -ItemType Directory -Force -Path $llvmRoot | Out-Null
            Write-Host "Installing LLVM silently into $llvmRoot"
            $installerProcess = Start-Process -FilePath $llvmInstaller `
              -ArgumentList @('/S', "/D=$llvmRoot") -PassThru -WindowStyle Hidden
            if (-not $installerProcess.WaitForExit(600000)) {
              try { $installerProcess.Kill() } catch {}
              throw 'LLVM 18.1.8 Windows installer exceeded the 10-minute installation limit.'
            }
            if ($installerProcess.ExitCode -ne 0) {
              throw "LLVM installer failed with exit code $($installerProcess.ExitCode)."
            }
            if (-not (Test-Path -LiteralPath $llvmBin)) { throw "LLVM installer did not create its bin directory: $llvmBin" }
          }
          foreach ($tool in $requiredTools) {
            if (-not (Test-Path -LiteralPath (Join-Path $llvmBin $tool))) { throw "Pinned LLVM tool is missing: $tool" }
          }
          $pythonRoot = (& python -c "import sys; print(sys.base_prefix)").Trim()
          if (-not $pythonRoot) { throw 'Unable to locate the configured Python runtime.' }
          $pythonDll = Join-Path $pythonRoot 'python310.dll'
          if (-not (Test-Path $pythonDll)) { throw "Configured Python runtime is missing python310.dll: $pythonDll" }
          $pythonLib = Join-Path $pythonRoot 'Lib'
          if (-not (Test-Path (Join-Path $pythonLib 'encodings'))) { throw "Configured Python runtime is missing its standard library: $pythonLib" }
          Copy-Item -Force $pythonDll (Join-Path $llvmBin 'python310.dll')
          $env:PYTHONHOME = $pythonRoot
          $llvmPython = Join-Path $llvmRoot 'lib/site-packages'
          if (-not (Test-Path (Join-Path $llvmPython 'lldb'))) { throw "LLVM LLDB Python modules are missing: $llvmPython" }
          $env:PYTHONPATH = $llvmPython
          "PYTHONHOME=$pythonRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$llvmPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$pythonRoot" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $lldbHelp = (& (Join-Path $llvmBin 'lldb-dap.exe') --help 2>&1 | Out-String)
          if ($lldbHelp -notmatch 'LLDB DAP') { throw "lldb-dap.exe did not start successfully: $lldbHelp" }
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $rustupInit = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
          $rustupVersion = '1.28.2'
          $rustupBase = "https://static.rust-lang.org/rustup/archive/$rustupVersion/x86_64-pc-windows-msvc"
          Invoke-WebRequest -Uri "$rustupBase/rustup-init.exe" -OutFile $rustupInit -TimeoutSec 120
          Invoke-WebRequest -Uri "$rustupBase/rustup-init.exe.sha256" -OutFile "$rustupInit.sha256" -TimeoutSec 120
          $expected = ((Get-Content "$rustupInit.sha256" -Raw).Trim() -split '\s+')[0].ToUpperInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $rustupInit).Hash.ToUpperInvariant()
          if ($expected -ne $actual) { throw 'rustup-init.exe checksum mismatch.' }
          & $rustupInit -y --no-modify-path --default-toolchain none --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "rustup-init.exe failed with exit code $LASTEXITCODE." }
          $cargoBin = Join-Path $env:USERPROFILE '.cargo/bin'
          $env:Path = "$cargoBin;$env:Path"
          "$cargoBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup set auto-self-update disable
          rustup toolchain install 1.82.0 --profile minimal --component rust-analyzer --no-self-update
          $rustAnalyzerBin = Join-Path $env:USERPROFILE '.rustup/toolchains/1.82.0-x86_64-pc-windows-msvc/bin'
          if (-not (Test-Path (Join-Path $rustAnalyzerBin 'rust-analyzer.exe'))) { throw 'Pinned rust-analyzer.exe was not installed.' }
          "$rustAnalyzerBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned Go, gopls, and Pyright
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Join-Path $env:USERPROFILE '.local/bin') | Out-Null
          $env:GOBIN = Join-Path $env:USERPROFILE '.local/bin'
          $env:GOTOOLCHAIN = 'local'
          $goVersion = go version
          if ($goVersion -notmatch 'go1.23.6') { throw "Unexpected Go version: $goVersion" }
          go install golang.org/x/tools/gopls@v0.17.1
          if (-not (Test-Path (Join-Path $env:GOBIN 'gopls.exe'))) { throw 'Pinned gopls.exe was not installed.' }
          $env:GOBIN | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          npm install --global pyright@1.1.390
      - name: Save pinned Windows toolchain cache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/llvm-18.1.8
            ~/.rustup/toolchains/1.82.0-x86_64-pc-windows-msvc
          key: codium-blocks-real-windows-toolchains-llvm-18.1.8-installer-python-3.10.11-rust-1.82.0-v8-${{ runner.os }}-${{ runner.arch }}
      - name: Verify pinned versions
        shell: pwsh
        run: |
          function Assert-OutputContains([string] $label, [string] $output, [string] $expected) {
            if ($output -notmatch [regex]::Escape($expected)) {
              throw "$label did not report the pinned value '$expected': $output"
            }
          }
          $clangdVersion = (& clangd.exe --version 2>&1 | Out-String)
          Assert-OutputContains 'clangd' $clangdVersion '18.1.8'
          $rustAnalyzerVersion = (& rust-analyzer.exe --version 2>&1 | Out-String)
          Assert-OutputContains 'rust-analyzer' $rustAnalyzerVersion '1.82.0'
          $goplsVersion = (& gopls.exe version 2>&1 | Out-String)
          Assert-OutputContains 'gopls' $goplsVersion 'v0.17.1'
          $pyrightVersion = (& pyright.cmd --version 2>&1 | Out-String)
          Assert-OutputContains 'pyright' $pyrightVersion '1.1.390'
          $clangVersion = (& clang.exe --version 2>&1 | Out-String)
          Assert-OutputContains 'clang' $clangVersion '18.1.8'
          $lldbHelp = (& lldb-dap.exe --help 2>&1 | Out-String)
          Assert-OutputContains 'lldb-dap startup' $lldbHelp 'LLDB DAP'
      - name: Run strict real LSP matrix
        shell: pwsh
        env:
          CODIUM_BLOCKS_REQUIRE_REAL_LSP: '1'
        run: node tests/real-lsp-smoke.mjs
      - name: Build real DAP debuggee
        shell: pwsh
        run: |
          clang-cl.exe /nologo /std:c++17 /Od /Zi /EHsc /MT /Fe:"$env:RUNNER_TEMP/codium-blocks-real-dap-debuggee.exe" tests/fixtures/real-dap-debuggee.cpp /link /DEBUG
      - name: Run strict real DAP matrix
        shell: pwsh
        env:
          CODIUM_BLOCKS_REQUIRE_REAL_DAP: '1'
          CODIUM_BLOCKS_REAL_DAP_TRACE: '1'
          CODIUM_BLOCKS_REAL_DAP_DEBUGGEE: ${{ runner.temp }}/codium-blocks-real-dap-debuggee.exe
          CODIUM_BLOCKS_REAL_DAP_SOURCE: ${{ github.workspace }}/tests/fixtures/real-dap-debuggee.cpp
        run: node tests/real-dap-smoke.mjs
